{% extends "admin/admin_master.html" %}

{% block content %}
<style>
    .hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .hover-lift:hover { transform: translateY(-3px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.15) !important; }
    
    /* Admin form styling */
    .form-floating > label { color: #6c757d; font-weight: 500; }
    .form-control:focus, .form-select:focus { border-color: #ffc107; box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25); }
</style>

<div class="container-fluid py-4 d-flex justify-content-center">
    
    <div class="card border-0 shadow-lg rounded-4 w-100 bg-white" style="max-width: 650px; border-top: 5px solid #ffc107 !important;">
        <div class="card-body p-4 p-md-5">
            
            <div class="text-center mb-4 pb-2 border-bottom border-light">
                <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-10 text-warning rounded-circle mb-3" style="width: 70px; height: 70px;">
                    <i class="bi bi-graph-up-arrow" style="font-size: 2.5rem; color: #d39e00;"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Update Market Price</h3>
                <p class="text-muted small">Log today's official Mandi rates for specific crops and districts.</p>
            </div>

            <form action="/update_price" method="POST">
                
                <div class="form-floating mb-3 shadow-sm rounded-3">
                    <select class="form-select border-0 bg-light fw-medium" id="crop_id" name="crop_id" required>
                        <option value="" disabled selected>-- Select a Crop --</option>
                        {% for crop in crops %}
                            <option value="{{ crop[0] }}">{{ crop[1] }} ({{ crop[2] }})</option>
                        {% endfor %}
                    </select>
                    <label for="crop_id"><i class="bi bi-basket-fill me-2"></i>Select Crop Commodity</label>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <div class="form-floating shadow-sm rounded-3">
                            <input type="text" class="form-control border-0 bg-light" id="state" name="state" placeholder="e.g. Maharashtra" required>
                            <label for="state"><i class="bi bi-map me-2"></i>State</label>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-floating shadow-sm rounded-3">
                            <input type="text" class="form-control border-0 bg-light" id="district" name="district" placeholder="e.g. Nashik" required>
                            <label for="district"><i class="bi bi-pin-map me-2"></i>District (Mandi)</label>
                        </div>
                    </div>
                </div>

                <div class="form-floating mb-4 shadow-sm rounded-3">
                    <input type="number" class="form-control border-0 bg-light fw-bold text-success fs-5" id="price" name="price" placeholder="e.g. 2500" min="0" required>
                    <label for="price"><i class="bi bi-currency-rupee me-2"></i>Price per Quintal (₹)</label>
                </div>

                <button type="submit" class="btn btn-warning text-dark w-100 fw-bold py-3 rounded-pill shadow hover-lift d-flex justify-content-center align-items-center gap-2">
                    <i class="bi bi-cloud-arrow-up-fill fs-5"></i> Publish Daily Rate
                </button>
                
            </form>

        </div>
    </div>

</div>
{% endblock %}
