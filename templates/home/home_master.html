<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrishiDhan | Smart Agriculture Portal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            background-color: #f8f9fa;
        }
        
        /* Modern Navbar Styling */
        .kd-navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .navbar-brand { font-weight: 800; color: #2e7d32 !important; font-size: 1.5rem; }
        .nav-link { font-weight: 500; color: #495057; transition: color 0.2s; padding: 0.5rem 1rem !important; }
        .nav-link:hover, .nav-link.active { color: #2e7d32; }
        
        /* Utility Classes */
        .hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.15) !important; }
        
        /* Google Translate Fixes */
        .goog-te-gadget-simple { 
            border: 1px solid #dee2e6 !important; 
            border-radius: 20px !important; 
            padding: 6px 12px !important; 
            font-family: 'Poppins', sans-serif !important; 
        }
        .goog-te-banner-frame { display: none !important; }
        body { top: 0 !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg kd-navbar sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="bi bi-tree-fill"></i> KrishiDhan
                </a>
            
            <button class="navbar-toggler border-0 shadow-none px-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <i class="bi bi-list fs-1 text-success"></i>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-3">
                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="/news_schemes">Agri News & Schemes</a>
                    </li>
                </ul>
                
                <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3 mt-3 mt-lg-0">
                    <div id="google_translate_element"></div>
                    
                    <a href="/login" class="btn btn-outline-success rounded-pill px-4 fw-bold hover-lift">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Login
                    </a>
                    <a href="/register" class="btn btn-success rounded-pill px-4 fw-bold hover-lift shadow-sm">
                        <i class="bi bi-person-plus me-1"></i> Register
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex flex-column">
        {% block content %}{% endblock %}
    </main>

    <div class="mt-auto">
        {% include 'common/footer.html' %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script type="text/javascript">
        function googleTranslateElementInit() {
          new google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'en,hi,mr,gu,pa,bn,ta,te,kn,ml',
              layout: google.translate.TranslateElement.InlineLayout.SIMPLE
          }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
