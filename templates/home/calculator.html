{% extends "home/home_master.html" %}

{% block content %}
<style>
    .hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .hover-lift:hover { transform: translateY(-5px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.15) !important; }
    .result-row { transition: background-color 0.2s ease; }
    .result-row:hover { background-color: #e9ecef !important; }
</style>

<div class="container-fluid py-5 d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    
    <div class="card border-0 shadow-lg rounded-4 w-100 hover-lift bg-white" style="max-width: 550px; border-top: 5px solid #0d6efd !important;">
        <div class="card-body p-4 p-md-5">
            
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 80px; height: 80px;">
                    <i class="bi bi-rulers" style="font-size: 2.5rem;"></i>
                </div>
                <h2 class="fw-bold text-dark mb-1">Land Calculator</h2>
                <p class="text-muted mb-0">Instantly convert farm area measurements.</p>
            </div>

            <div class="row g-3 mb-4 pb-3 border-bottom border-light">
                <div class="col-sm-7">
                    <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 1px;">Area Value</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-calculator text-primary"></i></span>
                        <input type="number" id="calcInput" class="form-control border-start-0 py-2 fw-bold" placeholder="Enter value..." oninput="calculateLand()" min="0">
                    </div>
                </div>
                <div class="col-sm-5">
                    <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 1px;">From Unit</label>
                    <select id="unitSelect" class="form-select shadow-sm py-2 fw-bold text-dark" onchange="calculateLand()">
                        <option value="acre">Acre</option>
                        <option value="hectare">Hectare</option>
                        <option value="guntha">Guntha</option>
                        <option value="sqft">Sq. Feet</option>
                        <option value="sqmeter">Sq. Meter</option>
                    </select>
                </div>
            </div>

            <div class="bg-light rounded-4 p-4 border border-secondary border-opacity-10 shadow-sm">
                <h6 class="fw-bold text-primary mb-3 text-uppercase" style="font-size: 0.8rem; letter-spacing: 1px;">Conversion Results</h6>
                
                <div class="d-flex justify-content-between align-items-center border-bottom border-secondary border-opacity-25 pb-3 mb-3 result-row px-2 rounded">
                    <span class="text-muted fw-bold"><i class="bi bi-bounding-box-circles me-2"></i>Acres</span>
                    <span id="res-acre" class="fw-bold text-dark fs-5">0.0000</span>
                </div>
                
                <div class="d-flex justify-content-between align-items-center border-bottom border-secondary border-opacity-25 pb-3 mb-3 result-row px-2 rounded">
                    <span class="text-muted fw-bold"><i class="bi bi-grid-3x3 me-2"></i>Hectares</span>
                    <span id="res-hectare" class="fw-bold text-dark fs-5">0.0000</span>
                </div>
                
                <div class="d-flex justify-content-between align-items-center border-bottom border-secondary border-opacity-25 pb-3 mb-3 result-row px-2 rounded">
                    <span class="text-muted fw-bold"><i class="bi bi-aspect-ratio me-2"></i>Guntha</span>
                    <span id="res-guntha" class="fw-bold text-dark fs-5">0.00</span>
                </div>
                
                <div class="d-flex justify-content-between align-items-center result-row px-2 rounded">
                    <span class="text-muted fw-bold"><i class="bi bi-square me-2"></i>Sq. Feet</span>
                    <span id="res-sqft" class="fw-bold text-dark fs-5">0.00</span>
                </div>
            </div>

            <div class="text-center mt-5">
                <a href="/" class="btn btn-outline-primary fw-bold rounded-pill px-4 hover-lift">
                    <i class="bi bi-arrow-left me-1"></i> Back to Home
                </a>
            </div>

        </div>
    </div>
</div>

<script>
    function calculateLand() {
        let val = parseFloat(document.getElementById('calcInput').value);
        let unit = document.getElementById('unitSelect').value;

        if (isNaN(val) || val < 0) {
            document.getElementById('res-acre').innerText = "0.0000";
            document.getElementById('res-hectare').innerText = "0.0000";
            document.getElementById('res-guntha').innerText = "0.00";
            document.getElementById('res-sqft').innerText = "0.00";
            return;
        }

        // 1. Convert everything to SQ FEET first (Base Unit)
        let sqft = 0;
        if (unit === 'acre') sqft = val * 43560;
        else if (unit === 'hectare') sqft = val * 107639;
        else if (unit === 'guntha') sqft = val * 1089;
        else if (unit === 'sqft') sqft = val;
        else if (unit === 'sqmeter') sqft = val * 10.764;

        // 2. Convert SQ FEET to target units and format them
        document.getElementById('res-acre').innerText = (sqft / 43560).toFixed(4);
        document.getElementById('res-hectare').innerText = (sqft / 107639).toFixed(4);
        document.getElementById('res-guntha').innerText = (sqft / 1089).toFixed(2);
        
        // Format Sq. Feet with commas for readability (e.g. 43,560.00)
        document.getElementById('res-sqft').innerText = sqft.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }
</script>
{% endblock %}
