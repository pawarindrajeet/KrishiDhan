{% extends "farmer/farmer_master.html" %}

{% block content %}
<style>
    .profile-card {
        max-width: 550px;
        margin: 2rem auto;
        border: none;
    }
    .profile-header {
        background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
        padding: 3rem 2rem;
        border-radius: 1rem 1rem 0 0;
        text-align: center;
        color: white;
    }
    .profile-avatar {
        width: 100px;
        height: 100px;
        background-color: white;
        color: #2e7d32;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: 700;
        margin: 0 auto 1.5rem;
        box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        border: 4px solid rgba(255,255,255,0.2);
    }
    .info-label {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #6c757d;
        margin-bottom: 0.2rem;
    }
    .info-value {
        font-size: 1.1rem;
        font-weight: 600;
        color: #212529;
    }
    .hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .hover-lift:hover { transform: translateY(-3px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.15) !important; }
</style>

<div class="container-fluid pb-5">
    
    <div class="card profile-card shadow-lg rounded-4 overflow-hidden">
        <div class="profile-header">
            <div class="profile-avatar animate__animated animate__zoomIn">
                {{ user[1][0] }}
            </div>
            <h2 class="fw-bold mb-1">{{ user[1] }}</h2>
            <p class="mb-0 opacity-75 d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-patch-check-fill"></i> Verified Farmer Account
            </p>
        </div>

        <div class="card-body p-4 p-md-5">
            <div class="row g-4">
                
                <div class="col-12 d-flex align-items-start gap-3">
                    <div class="bg-light p-3 rounded-3 text-success">
                        <i class="bi bi-phone fs-4"></i>
                    </div>
                    <div class="border-bottom pb-3 flex-grow-1">
                        <div class="info-label">Mobile Number</div>
                        <div class="info-value">{{ user[2] }}</div>
                    </div>
                </div>

                <div class="col-12 d-flex align-items-start gap-3">
                    <div class="bg-light p-3 rounded-3 text-success">
                        <i class="bi bi-geo-alt fs-4"></i>
                    </div>
                    <div class="border-bottom pb-3 flex-grow-1">
                        <div class="info-label">District</div>
                        <div class="info-value">{{ user[4] }}</div>
                    </div>
                </div>

                <div class="col-12 d-flex align-items-start gap-3">
                    <div class="bg-light p-3 rounded-3 text-success">
                        <i class="bi bi-globe fs-4"></i>
                    </div>
                    <div class="pb-3 flex-grow-1">
                        <div class="info-label">State</div>
                        <div class="info-value">{{ user[3] }}</div>
                    </div>
                </div>

            </div>

            <div class="text-center mt-5">
                <button class="btn btn-warning fw-bold px-5 py-3 rounded-pill shadow hover-lift text-dark">
                    <i class="bi bi-pencil-square me-2"></i> Edit My Profile
                </button>
                <div class="mt-4">
                    <a href="/farmer_dashboard" class="text-decoration-none text-muted small fw-bold">
                        <i class="bi bi-arrow-left me-1"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}
