{% extends "farmer/farmer_master.html" %}

{% block content %}
<style>
    .hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .hover-lift:hover { transform: translateY(-3px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.15) !important; }
</style>

<div class="container-fluid pb-5" style="max-width: 1000px; margin: 0 auto;">

    <div class="mb-4 mt-3">
        <a href="/crops/{{ crop[2] }}" class="btn btn-light text-success fw-bold shadow-sm rounded-pill px-4 hover-lift d-inline-flex align-items-center">
            <i class="bi bi-arrow-left me-2"></i> Back to {{ crop[2] }}
        </a>
    </div>

    <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
        <div class="row g-0">
            
            <div class="col-lg-5 position-relative bg-light">
                <img src="{{ url_for('static', filename='images/crops/' + crop[3]) }}" 
                     onerror="this.onerror=null; this.src='/static/images/products/default_product.png';"
                     alt="{{ crop[1] }}" 
                     class="img-fluid w-100 h-100" style="object-fit: cover; min-height: 350px;">
                
                <div class="position-absolute top-0 start-0 p-3">
                    <span class="badge bg-dark bg-opacity-75 text-white border border-secondary px-3 py-2 fs-6 rounded-pill shadow-sm text-uppercase" style="letter-spacing: 1px;">
                        {{ crop[2] }}
                    </span>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card-body p-4 p-md-5 d-flex flex-column h-100">

                    <h1 class="fw-bold text-success mb-4 display-5">{{ crop[1] }}</h1>

                    <div class="mb-4 flex-grow-1">
                        <h5 class="fw-bold text-dark d-flex align-items-center mb-3 border-bottom pb-2">
                            <i class="bi bi-journal-text text-primary me-2 fs-4"></i> Description & Tips
                        </h5>
                        <p class="text-muted fs-5" style="line-height: 1.8;">
                            {{ crop[5] }}
                        </p>
                    </div>

                    <div class="bg-success bg-opacity-10 border border-success border-opacity-25 rounded-4 p-4 mt-3">
                        <h5 class="fw-bold text-success d-flex align-items-center mb-2">
                            <i class="bi bi-layers-half me-2 fs-4"></i> Soil Requirements
                        </h5>
                        <p class="text-dark mb-0 fs-6" style="line-height: 1.6;">
                            {{ crop[4] }}
                        </p>
                    </div>

                    <div class="mt-4 pt-3 border-top d-flex flex-column flex-sm-row gap-3">
                        <a href="/my_crops" class="btn btn-success fw-bold px-4 py-2 rounded-pill shadow-sm hover-lift flex-grow-1 d-flex justify-content-center align-items-center">
                            <i class="bi bi-plus-circle me-2"></i> Track in My Farm
                        </a>
                        <a href="/shop" class="btn btn-outline-success fw-bold px-4 py-2 rounded-pill shadow-sm hover-lift flex-grow-1 d-flex justify-content-center align-items-center">
                            <i class="bi bi-shop me-2"></i> Shop Seeds
                        </a>
                    </div>

                </div>
            </div>
            
        </div>
    </div>

</div>
{% endblock %}
